# On main, each chart whose version is not released yet is packaged, made
# a GitHub release, and listed in index.yaml on the gh-pages branch, which
# GitHub Pages serves as the Helm repository. The branch also carries the
# repository's page, copied from site/, and is made if it is not there.
# Reference: https://github.com/helm/chart-releaser-action
name: Release

on:
  push:
    branches:
      - main
    paths:
      - charts/**
      - site/**

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5.1.0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish the page to gh-pages
        run: |
          set -eu
          git worktree add --detach pages
          cd pages
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch origin gh-pages
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rfq .
          fi
          cp -R ../site/. .
          git add -A
          if git diff --cached --quiet; then
            echo "the page is as published"
          else
            git commit -m "site: publish from ${GITHUB_SHA}"
            git push origin gh-pages
          fi
          cd ..
          git worktree remove --force pages

      - name: Release the charts
        uses: helm/chart-releaser-action@v1.9.0
        with:
          charts_dir: charts
          pages_branch: gh-pages
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
