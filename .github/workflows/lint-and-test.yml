# Every chart that changed is linted by chart-testing (helm lint, yamllint,
# a maintainer that exists on GitHub, a version bumped from main) and
# rendered by helm template. Installing into a cluster waits on a
# published image of turboreld.
# Reference: https://github.com/helm/chart-testing-action
name: Lint and test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5.1.0

      # ct lint runs yamllint and yamale, which need Python.
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.x"
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0

      - name: List the charts that changed
        id: changed
        run: |
          changed=$(ct list-changed --config .github/configs/ct.yaml)
          if [ -n "$changed" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        if: steps.changed.outputs.changed == 'true'
        run: ct lint --config .github/configs/ct.yaml --lint-conf .github/configs/lintconf.yaml

      - name: Render
        if: steps.changed.outputs.changed == 'true'
        run: |
          for chart in $(ct list-changed --config .github/configs/ct.yaml); do
            helm template "$(basename "$chart")" "$chart" --namespace turborel > /dev/null
          done
