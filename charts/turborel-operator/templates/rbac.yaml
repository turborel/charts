apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "turborel-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "turborel-operator.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ if .Values.watchNamespace }}Role{{ else }}ClusterRole{{ end }}
metadata:
  name: {{ include "turborel-operator.fullname" . }}
  {{- if .Values.watchNamespace }}
  namespace: {{ .Values.watchNamespace }}
  {{- end }}
  labels:
    {{- include "turborel-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [database.turborel.com]
    resources: [clusters, backups, scheduledbackups]
    verbs: [get, list, watch]
  - apiGroups: [database.turborel.com]
    resources: [backups]
    verbs: [create]
  - apiGroups: [database.turborel.com]
    resources: [clusters/status, backups/status, scheduledbackups/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [pods, services, configmaps, secrets, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ if .Values.watchNamespace }}RoleBinding{{ else }}ClusterRoleBinding{{ end }}
metadata:
  name: {{ include "turborel-operator.fullname" . }}
  {{- if .Values.watchNamespace }}
  namespace: {{ .Values.watchNamespace }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ if .Values.watchNamespace }}Role{{ else }}ClusterRole{{ end }}
  name: {{ include "turborel-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "turborel-operator.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "turborel-operator.fullname" . }}-leader
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "turborel-operator.fullname" . }}-leader
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "turborel-operator.fullname" . }}-leader
subjects:
  - kind: ServiceAccount
    name: {{ include "turborel-operator.fullname" . }}
    namespace: {{ .Release.Namespace }}
